mpdn-prod:
  build: .
  dockerfile: ./alpine-fpm/Dockerfile
  environment:
    - PHP_VERSION=7.4.
    - FPM_PM=dynamic
    - FPM_PM_MAX_CHILDREN=5
    - FPM_PM_START_SERVERS=2
    - FPM_PM_MIN_SPARE_SERVERS=1
    - FPM_PM_MAX_SPARE_SERVERS=3
    - FPM_SESSION_SAVE_PATH=tcp://127.0.0.1:11211?persistent=1&weight=1&timeout=1&retry_interval=15
    - PHP_UPLOAD_MAX_FILESIZE=8M
    - PHP_POST_MAX_SIZE=8M
    - APPDIR=/app
    - PROJECT=mpdn
    - GITLAB_PAT=EDIT-SENDIRI
    - TIMEZONE=Asia/Jakarta
    - DOMAIN=mpdn.kemkes.go.id

  ports:
    - "9000:9000"
    

