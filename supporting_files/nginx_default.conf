server {
    listen 80;
    server_name  mpdn.kemkes.appgo.my.id mpdn.kemkes.go.id demompdn.kemkes.go.id mpdn.kubuslab.id demompdn.kubuslab.id mpdn.kemkes.kubuslab.id demompdn.kemkes.kubuslab.id;
   
    return 301 https://$server_name$request_uri;
}
server {
    listen 443 ssl http2;
    server_name  mpdn.kemkes.appgo.my.id mpdn.kemkes.go.id demompdn.kemkes.go.id mpdn.kubuslab.id demompdn.kubuslab.id mpdn.kemkes.kubuslab.id demompdn.kemkes.kubuslab.id;

    ssl_certificate /etc/ssl/certs/mpdn.kemkes.appgo.my.id.crt;
    ssl_certificate_key /etc/ssl/private/mpdn.kemkes.appgo.my.id.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /app/mpdn;
    #access_log      off;
    access_log      /var/log/nginx/mpdn.access.log;
    error_log       /var/log/nginx/mpdn.error.log;
    # autoindex        on;
    index index.php index.html index.htm;

    # Apple Site Association
    location /apple-app-site-association {
        alias /home/app/mpdn2/resources/mpdn/ios/;
        index apple-app-site-association.json;
        autoindex on;
    }

    # STATIC FILE CACHING
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|ttf|html|json)$ {
        access_log        off;
        log_not_found     off;
        expires           30d;
    }

    # STATIC ASSETS YANG DILARANG
    location ~* \.(git|rb|inc|ht|log)$ {
        deny all;
        return 403;
    }

    # STATIC ASSETS YANG DIBOLEHKAN
    location ^~ /assets/ {
        allow all;
    }

    # AKSES LANGSUNG KE SCRIPT PHP
    location ~ \..*/.*\.php$ {
        return 403;
    }

    location ~ \..*/.*\.sh$ {
        return 403;
    }

    location ~ ^/(application|org|modules|system|vendor)/ {
        deny all;
        return 403;
    }

    location ~ ^/(application|org|modules|system|vendor|assets|public)/.*\.php$ {
        return 403;
    }

    location ~ ^/(application|org|modules|system|vendor|assets|public)/.*\.sh$ {
        deny all;
        return 403;
    }

    # Block access to "hidden" files and directories whose names begin with a
    # period. This includes directories used by version control systems such
    # as Subversion or Git to store control files.
    location ~ (^|/)\. {
        deny all;
        return 403;
    }

    # KONFIGURASI CODEIGNITER
    location / {
        # add_header 'X-Frame-Options' 'SAMEORIGIN';
        # try_files $uri $uri/ /index.php?$query_string;
        try_files $uri $uri/ /index.php;
    }

    # location ~ \.php$ {
    #     return 444;
    # }

    # PHP-FPM PROXY
    location ~ \.php$ {
        # fastcgi_pass backend:9000;
        fastcgi_pass   unix:/run/php-fpm.sock;
        fastcgi_index  index.php;                                                                                                                   
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;                                                                         
        fastcgi_param  PATH_INFO $fastcgi_path_info;                                                                                                
        fastcgi_param  QUERY_STRING $query_string;                                                                                                  
        fastcgi_intercept_errors on;                                                                                                                
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;                                                                                                 
        include fastcgi_params;
    }
} 